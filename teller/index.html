<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="robots" content="noindex"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="referrer" content="no-referrer"><title>Weiter zum Demenz Coach</title></head>
<body><p>Du wirst weitergeleitet.</p><noscript><p><a href="/de/">Zur Website</a> · <a href="/start/">Zum persönlichen Plan</a></p></noscript>
<script>
(() => {
  const mailQuery = new URL(location.href).searchParams.getAll('q');
  if (mailQuery.length === 1 && ['mail_weiter', 'mail_willkommen'].includes(mailQuery[0])) {
    location.replace('/de/demenz-alltagstipps.html');
    return;
  }
  let arm;
  try {
    if (localStorage.getItem('demenzcoach.analyticsConsent.v1') === 'granted') {
      const record = JSON.parse(localStorage.getItem('demenzcoach.teller.v1'));
      if (['website', 'funnel'].includes(record?.arm) && record.expiresAt > Date.now()
        && record.expiresAt <= Date.now() + 30 * 86400000) arm = record.arm;
    }
  } catch { /* no persistence without consent or when storage is blocked */ }
  arm ||= crypto.getRandomValues(new Uint32Array(1))[0] < 2 ** 31 ? 'website' : 'funnel';
  location.replace(`${arm === 'website' ? '/de/' : '/start/'}?teller=${arm}`);
})();
</script></body></html>
