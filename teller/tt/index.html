<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<link rel="canonical" href="https://dementiacoachapp.com/teller/">
<title>Demenz Coach: Der Teller-Trick</title>
<noscript><meta http-equiv="refresh" content="0; url=/teller/?q=tt"></noscript>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#fff8ef;font:700 20px/1.4 system-ui,sans-serif;color:#2b2622}a{color:#d62828}</style>
</head>
<body>
<p><a href="/teller/?q=tt">Weiter zu den 5 Tricks …</a></p>
<script>
// Kurz-Pfad pro Kanal (tt): Cloudflare Web Analytics zählt diesen Pfad, dann geht es weiter zur Seite.
// ?q=slug wird zu q=tt_slug (App-Store-Kampagne lp_..._tt_slug).
(function () {
  var q = (new URLSearchParams(location.search).get("q") || "").toLowerCase().replace(/[^a-z0-9_]/g, "").slice(0, 12);
  var to = "/teller/?q=tt" + (q ? "_" + q : "") + location.hash;
  var go = function () { location.replace(to); };
  if (document.readyState === "complete") setTimeout(go, 150);
  else window.addEventListener("load", function () { setTimeout(go, 150); });
  setTimeout(go, 1500);
})();
</script>
</body>
</html>
