name: Web UI regression

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/web-ui-regression.yml'
      - 'scripts/ui-regression/**'
      - 'scripts/test-web-ui-no-prompt.cjs'
      - 'scripts/generator-preview.cjs'
      - 'demenz-uebersetzer/**'
      - 'de/**'
      - 'en/**'
      - 'content/**'
      - 'assets/zeichnungen/**'
      - 'einfach.css'
      - 'cloudflare-worker.js'
      - 'wrangler.jsonc'

permissions:
  contents: read

jobs:
  web-ui-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Install locked test dependencies
        run: npm ci --prefix scripts/ui-regression --ignore-scripts --no-audit --no-fund
      - name: Install matching Chromium
        run: scripts/ui-regression/node_modules/.bin/playwright install --with-deps chromium
      - name: Check rendered UI with mocked responses only
        env:
          PLAYWRIGHT_MODULE: ${{ github.workspace }}/scripts/ui-regression/node_modules/playwright
        run: node scripts/test-web-ui-no-prompt.cjs
