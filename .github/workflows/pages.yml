name: Website checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify legal pages are complete
        run: |
          if grep -R "{{LADUNGSFAEHIGE_ANSCHRIFT}}" . --include="*.html"; then
            echo "A required legal address is still missing."
            exit 1
          fi
      - name: Validate SEO, links and structured data
        run: node scripts/validate-seo.mjs .
